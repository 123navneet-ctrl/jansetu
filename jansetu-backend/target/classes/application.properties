# JanSetu Spring Boot Configuration
server.port=8080

# MySQL Database Configuration (Hand-written JDBC)
# Override via environment variables or edit for your local environment:
# DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jansetu_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CORS Configuration
jansetu.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# File Storage Configuration for CSV Exports/Imports
jansetu.storage.export-dir=./exports
jansetu.storage.backup-dir=./backups

